name: Deploy Astro

on:
  push:
    branches: [src]
    paths-ignore:
      - 'README.md'
      - 'Agent.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# 实测基线（ubuntu-latest）：checkout 1s / setup-node 2s / npm ci 3s / build 5s /
# upload-pages-artifact 1s / deploy-pages 6s；其余是 runner 排队与 job 启动开销。
#
# 部署必须串行：实测两个运行同时执行 actions/deploy-pages 会互相卡死
# （并发部署时第二个运行停在 deploy-pages 数分钟不结束）。
# 因此沿用共享 group + cancel-in-progress: false：正在跑的部署绝不会被打断。
# 代价是 GitHub 对同一 group 只保留 1 个排队运行，3 个以上提交在同一个 job 时长内
# 连推时，最早的排队运行会被顶掉；被顶掉的提交内容仍会随后续提交的完整构建上线。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 部署占着 pages 这个全局串行锁，实测正常只要 ~30s；超时收紧，避免卡住后续提交的部署。
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
